<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e75bd">
<title>Offline — CompassDocs Desk</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #475569; --line: #e2e8f0; --accent: #2e75bd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2b; --ink: #e2e8f0; --muted: #a3b1c6; --line: #24324a; --accent: #7fb0e6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .card { max-width: 28rem; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 40px 24px; text-align: center; box-sizing: border-box; }
  img { width: 48px; height: 48px; border-radius: 12px; }
  h1 { font-size: 1rem; font-weight: 600; margin: 16px 0 4px; }
  p { color: var(--muted); font-size: .875rem; margin: 0 0 20px; }
  button { font: inherit; font-size: .875rem; font-weight: 600; color: #fff; background: #2e75bd; border: 0; border-radius: 8px; height: 36px; padding: 0 16px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="card" role="status">
    <img src="/desk-192.png" alt="">
    <h1>You're offline</h1>
    <p>The desk needs a connection to load tickets. It will come back as soon as this device is online again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
